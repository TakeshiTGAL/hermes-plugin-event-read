name: event-read
version: 0.1.3
manifest_version: 2
requires_hermes: ">=0.21.6"
description: "Read one CalDAV calendar collection you run, with list_events and read_event. A CalDAV calendar holds events as iCalendar (ICS) data; list_events returns the summary, start, end and time zone of the events in a date range, and read_event returns one event by its uid. Disclosure — Sends CALDAV_USER and CALDAV_PASSWORD as Basic auth to your CALDAV_URL, does not follow redirects, and starts no local program. Over plain http that password travels unencrypted. The tools are on for every surface, including gateways, and the plugin has no user list of its own: anyone you allow on your Hermes gateway reads the calendar with your password. Turn a surface off with hermes tools. On Hermes 0.21.6 and later, while the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. A watch is a cron job you create yourself with hermes cron create. Each run is at least one model turn, there is no daily cap, and the job stays until you run hermes cron remove. Under plugins.isolation: host the watch cannot run and posts a notice saying so on every run. When the watch can run, it reports a problem on the first run, when the cause changes and again after 23 hours, or on every run when its data directory cannot be written. Each request gives up after 20 seconds without data, and a whole call has no time limit. The watch reads cron.execution_identity.current_cron_execution (Hermes 0.21.6). The file write still uses Hermes's write guard. An update can stop the watch if that guard moves. State lives in plugin-data/event-read. Not tested against a vendor-hosted calendar."
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-event-read
tags: [caldav, cron]
provides_tools:
  - list_events
  - read_event
provides_hooks: []
requires_env:
  - name: CALDAV_URL
    description: "http or https URL of one CalDAV collection you already run. A host and a non-empty path are required. No username, query, or fragment. Over plain http the password is sent unencrypted."
    prompt: "CalDAV collection URL"
    secret: false
    password: false
  - name: CALDAV_USER
    description: "User name sent as HTTP Basic on every request. It is not stored in the plugin data file."
    prompt: "CalDAV user"
    secret: false
    password: false
  - name: CALDAV_PASSWORD
    description: "Password sent as HTTP Basic on every request. It is not stored in the plugin data file."
    prompt: "CalDAV password"
    secret: true
    password: true
